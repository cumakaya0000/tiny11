name: Build release candidate

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup 7
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: ./installer/scripts/build-installer.ps1
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: Get-FileHash artifacts/installer/NexusPC-Setup-x64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  NexusPC-Setup-x64.exe" } | Set-Content artifacts/installer/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NexusPC-${{ github.ref_name }}-unsigned
          path: artifacts/installer/*
          if-no-files-found: error
          retention-days: 30
